[tool:pytest]
addopts =
    -v
    --cov=src
    --cov-report=html
    --cov-report=term-missing
testpaths = test/
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    network: Tests that require network access
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning